# Builds the offline desktop app for Windows, macOS and Linux when a version tag
# (v1.0.0, v1.1.0, ...) is pushed, attaches the installers to a GitHub Release,
# and publishes SHA-256 checksums, an SBOM and signed build-provenance attestations
# (verify with: gh attestation verify <file> --repo <owner>/<repo>).
# The release is created as a draft and only published after the checksums and
# SBOM are attached, so nobody can download a half-finished release. Release
# builds use no caches, so a poisoned cache from another workflow cannot reach them.
name: Release desktop app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # workflow_dispatch is only for re-running a release from a version tag, never a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      - name: Linux build libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --ignore-scripts
      - name: Cargo.lock is up to date (the build must not re-resolve dependencies)
        shell: bash
        run: cargo metadata --locked --format-version 1 --manifest-path desktop/src-tauri/Cargo.toml > /dev/null
      - name: Check the bundled data before packaging it
        run: node scripts/sign-manifest.mjs --verify
      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: Solar Odyssey ${{ github.ref_name }}
          releaseBody: |
            Offline desktop app for Windows (.msi / .exe), macOS (.dmg) and Linux (.AppImage / .deb / .rpm).
            Check a download against SHA256SUMS.txt, or verify its signed provenance with
            `gh attestation verify <file> --repo ${{ github.repository }}`.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      # Provenance for the bytes this job built, before they leave the runner. (The
      # checksums job below attests what it downloads from the release, which only
      # proves what was on the release at that moment.)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            desktop/src-tauri/target/**/release/bundle/**/*.msi
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/**/*.dmg
            desktop/src-tauri/target/**/release/bundle/macos/*.tar.gz
            desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            desktop/src-tauri/target/**/release/bundle/**/*.deb
            desktop/src-tauri/target/**/release/bundle/**/*.rpm

  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dist
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir dist --pattern '*'
          rm -f dist/SHA256SUMS.txt dist/sbom.spdx.json
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Upload checksums and SBOM, then publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/SHA256SUMS.txt dist/sbom.spdx.json --repo "${GITHUB_REPOSITORY}" --clobber
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
