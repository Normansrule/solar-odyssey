<header id="site-header"></header>
<main id="main" class="page glossary-page">

    <h1>Glossary</h1>
    <p class="lede">Every term used on this site, in plain language. Terms marked with a dotted underline in the lessons link here.</p>

  <div class="gl-tools wide">
