[package]
name = "solar-odyssey"
version = "1.1.0"
description = "Solar Odyssey: the history, physics and future of solar power, offline"
authors = ["Solar Odyssey contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No plugins: the app only shows the bundled site. No shell, filesystem, HTTP or updater access.
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
