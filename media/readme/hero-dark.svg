<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
<title id="t">Solar Odyssey</title>
<desc id="d">The history of solar power drawn as one day: the sun rises along an arc from 1839 through Fritts, Einstein, Bell Labs, Vanguard 1, the 1970s and perovskites to today, with the research frontier as a dashed path beyond.</desc>
